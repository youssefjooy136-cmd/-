<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEON RP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }
        /* زرار تفاعلي لضمان تشغيل الصوت في فايف إم */
        #play-btn {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        .btn-box {
            color: white;
            border: 2px solid white;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            transition: 0.3s;
        }
        .btn-box:hover {
            background: rgba(255,255,255,0.3);
        }
        .loading-container {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            max-width: 300px;
            text-align: center;
            z-index: 3;
        }
        .progress-bar-box {
            width: 100%;
            height: 5px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.2s ease;
        }
        .loading-text {
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <video autoplay loop playsinline id="bg-video">
        <source src="intro.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="overlay"></div>

    <!-- زرار التشغيل الإجباري للصوت -->
    <div id="play-btn" onclick="startAudio()">
        <div class="btn-box">اضغط هنا لدخول سيرفر LEON RP 🎬</div>
    </div>

    <div class="loading-container">
        <div class="progress-bar-box">
            <div id="progress-fill"></div>
        </div>
        <div class="loading-text" id="loading-txt">جاري تحميل ملفات السيرفر...</div>
    </div>

    <script>
        function startAudio() {
            var video = document.getElementById('bg-video');
            video.muted = false;
            video.volume = 1.0;
            video.play();
            document.getElementById('play-btn').style.display = 'none';
        }

        // ربط نسبة التحميل الحقيقية للعبة
        window.addEventListener('message', function(e) {
            var data = e.data;
            if (data.eventName === 'loadProgress') {
                var percentage = Math.round(data.loadFraction * 100);
                document.getElementById('progress-fill').style.width = percentage + '%';
                document.getElementById('loading-txt').innerText = 'جاري التحميل... ' + percentage + '%';
            }
        });
    </script>

</body>
</html>
