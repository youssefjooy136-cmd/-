<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEON RP - التقديم</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background-color: #181818;
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 5px;
        }
        p.sub {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #d4af37;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #252525;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #1e7e34;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>LEON RP - التقديم</h2>
    <p class="sub">قم بملء البيانات التالية بدقة لتقييم طلبك</p>

    <form id="applyForm">
        <label>الاسم الحقيقي:</label>
        <input type="text" id="name" required placeholder="أدخل اسمك الحقيقي">

        <label>العمر:</label>
        <input type="number" id="age" required placeholder="أدخل عمرك">

        <label>اسمك في ديسكورد (Discord Username):</label>
        <input type="text" id="discord" required placeholder="مثال: user_123">

        <label>اسم الشخصية داخل اللعبة (In-Game Character Name):</label>
        <input type="text" id="ingameName" required placeholder="مثال: Jack Spencer">

        <label>قصة الشخصية (Backstory):</label>
        <textarea id="story" rows="4" required placeholder="اكتب قصة شخصيتك باختصار..."></textarea>

        <label>لماذا انضممت إلينا؟</label>
        <textarea id="reason" rows="3" required placeholder="سبب انضمامك للسيرفر..."></textarea>

        <button type="submit" id="submitBtn">إرسال الطلب</button>
    </form>
</div>

<script>
    const form = document.getElementById('applyForm');
    const submitBtn = document.getElementById('submitBtn');

    // رابط الـ Webhook الخاص بك
    const webhookUrl = "https://discord.com/api/webhooks/1534030878575951933/-OMrFp-xu01ZeWKVXFNLbLM8YqXPz6Hls4Eshs5mFM7WiIqPhFuZQrdUPQfsypfZA-jG";

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = "جاري الإرسال...";

        const name = document.getElementById('name').value;
        const age = document.getElementById('age').value;
        const discord = document.getElementById('discord').value;
        const ingameName = document.getElementById('ingameName').value;
        const story = document.getElementById('story').value;
        const reason = document.getElementById('reason').value;

        const payload = {
            embeds: [{
                title: "📝 طلب تقديم جديد - LEON RP",
                color: 13808727,
                fields: [
                    { name: "الاسم الحقيقي", value: name, inline: true },
                    { name: "العمر", value: age, inline: true },
                    { name: "حساب الديسكورد", value: discord, inline: false },
                    { name: "اسم الشخصية باللعبة", value: ingameName, inline: false },
                    { name: "قصة الشخصية (Backstory)", value: story, inline: false },
                    { name: "سبب الانضمام", value: reason, inline: false }
                ],
                footer: { text: "نظام التقديم الآلي" },
                timestamp: new Date()
            }]
        };

        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.ok) {
                alert("تم إرسال طلبك بنجاح! ✅");
                form.reset();
            } else {
                alert("حدث خطأ أثناء الإرسال، تأكد من صحة الرابط أو حاول لاحقاً. ❌");
            }
        })
        .catch(error => {
            alert("حدث خطأ في الاتصال! ❌");
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "إرسال الطلب";
        });
    });
</script>

</body>
</html>
